[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agenthub-client"
version = "0.1.0"
description = "The 4genthub local client: seat sync, status bridge, seat policy, team setup, context compaction and watch tools"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6", "python-dotenv>=1"]

[project.scripts]
4genteam = "agenthub_client.cli:main"
agenthub-client = "agenthub_client.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The no-MCP submission door is a shell script, not a module, so setuptools drops it unless it is
# named here: a wheel built without this line carries the twelve modules and no seat_feedback.sh,
# and `4genteam feedback` then has nothing to run on any machine but an editable checkout.
[tool.setuptools.package-data]
agenthub_client = ["seat_feedback.sh"]

[tool.pytest.ini_options]
addopts = "--noconftest -p no:cacheprovider"
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["unit: no network, no rig, no seat"]
